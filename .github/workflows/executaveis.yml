name: executáveis
# Gera o executável de Windows, macOS e Linux. Roda ao criar uma tag (v1.0.0...) ou manualmente.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write          # para anexar os executáveis na Release da tag

jobs:
  executavel:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - name: Tempo ocioso no KDE Plasma com Wayland (opcional, fora do requirements.txt)
        if: runner.os == 'Linux'
        run: pip install "pywayland>=0.4.19"
      - name: Gerar o executável (lançador com o código dentro)
        shell: bash
        run: |
          # O .exe é o lancador.py: baixa versões novas do código sozinho (ver lancador.py).
          # O código vai dentro dele como arquivos (embutido/), para ser a versão de reserva sem internet.
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA="--windowed"; fi
          HIDDEN="$(python ferramentas/importacoes.py)"
          python -m PyInstaller --noconfirm --onefile $EXTRA $HIDDEN \
            --add-data "$PWD/pestinha:embutido/pestinha" --add-data "$PWD/main.py:embutido" \
            --add-data "$PWD/pets:embutido/pets" --add-data "$PWD/assets:embutido/assets" \
            --add-data "$PWD/atualizacao.json:embutido" \
            --name Pestinha --distpath dist --workpath build/work --specpath build lancador.py
      - name: Montar a pasta de entrega
        shell: bash
        run: |
          SISTEMA="$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          PASTA="executáveis/$SISTEMA"
          mkdir -p "$PASTA"
          cp -R dist/Pestinha* "$PASTA/"
      - uses: actions/upload-artifact@v4
        with:
          name: pestinha-${{ runner.os }}
          path: executáveis/
      - name: Compactar para a Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python -c "import shutil,sys; shutil.make_archive('Pestinha-' + sys.argv[1], 'zip', 'executáveis')" "$RUNNER_OS"
      - name: Publicar na Release (link de download do site)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Pestinha-*.zip
